<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NestMinds — Em breve</title>
  <meta name="description" content="NestMinds — acompanhamento psicológico. Site em construção." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #FAF6EF;
      --sage: #388888;
      --terracotta: #E88058;
      --charcoal: #2B2724;
      --charcoal-muted: #6B6259;
      --font-heading: 'Fraunces', Georgia, serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      color: var(--charcoal);
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .wrap { max-width: 540px; }
    .eyebrow {
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--sage);
      font-weight: 500;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: clamp(2.5rem, 8vw, 3.75rem);
      line-height: 1.05;
      margin-bottom: 1rem;
    }
    h1 .dot { color: var(--terracotta); }
    p {
      color: var(--charcoal-muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .rule {
      width: 48px;
      height: 3px;
      background: var(--terracotta);
      border-radius: 3px;
      margin: 0 auto 2rem;
    }
    a.contact {
      color: var(--sage);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid currentColor;
      padding-bottom: 2px;
    }
    a.contact:hover { color: var(--terracotta); }
    footer {
      position: fixed;
      bottom: 1.5rem;
      left: 0; right: 0;
      font-size: 0.75rem;
      color: var(--charcoal-muted);
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">NestMinds</p>
    <h1>Em breve<span class="dot">.</span></h1>
    <div class="rule"></div>
    <p>Estamos a preparar um espaço de acompanhamento psicológico feito para si. Volte em breve.</p>
    <a class="contact" href="mailto:geral@nestminds.pt">geral@nestminds.pt</a>
  </main>
  <footer>NestMinds · uma marca PsiNest, Lda</footer>
</body>
</html>
